      'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6',
      'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      'M4 4h16v16H4zM4 9h16M9 9v11',
      'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      'M4 20V10M10 20V4M16 20v-7M22 20H2',
      'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
    ];
    const hrefs = { 0: 'Main.dc.html', 1: 'FichaPropietario.dc.html', 2: 'Propiedad.dc.html', 6: 'Obligaciones.dc.html', 7: 'ResumenDeposito.dc.html' };
    const base = 'display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px;';
    const nav = x.nav.map((label, i) => ({
      label, icon: icons[i], href: hrefs[i] || '#',
      style: base + (i === 6 ? ' background: ' + t.sidebarActive + '; color: ' + t.sidebarStrong + '; font-weight: 500;' : ' color: ' + t.sidebarText + ';')
    }));
    const chip = 'display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap;';
    const est = {
      Vencida: chip + ' background: ' + t.dangerBg + '; color: ' + t.dangerText + ';',
      Pendiente: chip + ' background: ' + t.neutralBg + '; color: ' + t.neutralText + ';',
      Pagada: chip + ' background: ' + t.okBg + '; color: ' + t.okText + ';',
      ACompletar: chip + ' background: ' + t.hlBg + '; color: ' + t.hlText + ';'
    };
    const orden = ['es', 'en', 'pt'];
    const ctx = { t, x, loc, lang, money, fecha, chip, est };
    const page = this.page(ctx);
    return Object.assign({
      t, x, nav,
      langTag: loc,
      idiomaCodigo: lang.toUpperCase(),
      idiomaLabel: x.idioma,
      cambiarIdioma: () => this.setState({ lang: orden[(orden.indexOf(lang) + 1) % orden.length] }),
      rootClass: oscuro ? 'tema-oscuro' : 'tema-claro',
      temaLabel: oscuro ? x.aClaro : x.aOscuro,
      temaIcon: oscuro ? 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
      toggleTema: () => this.setState({ oscuro: !this.state.oscuro })
    }, page);
  }

  page(c) {
    const { t, x, loc, money } = c;
    const P = '[' + x.prop + ' A]';
    const base = [
      ['Terreno Berrotarán', 'terreno', 'municipalidad', 9800, '2026-11-10'],
      ['Auto AI539LO', 'vehiculo', 'seguro', 54300, '2026-11-05'],
      ['Gastos varios · ' + P, 'otros', 'pagoPersona', 120000, '2026-11-01'],
      ['Depto Centro 3B', 'inmueble', 'municipalidad', 41300, '2026-11-08'],
      ['Casa Barrio Norte', 'inmueble', 'rentas', 18700, '2026-11-20']
    ];
    const v = this.state.vals || {};
    const fmt = (n) => new Intl.NumberFormat(loc, { maximumFractionDigits: 0 }).format(n);
    const items = base.map(([bien, tipo, conc, prev, vto], i) => {
      const cur = v[i] || { monto: '', fecha: '' };
      const ok = String(cur.monto).trim() !== '';
      const set = (patch) => this.setState({ vals: Object.assign({}, this.state.vals || {}, { [i]: Object.assign({}, (this.state.vals || {})[i] || { monto: '', fecha: '' }, patch) }) });
      return {
        bien, bienProp: tipo === 'otros' ? bien : bien + ' · ' + P, icon: this.tipoIcon(tipo), concepto: x[conc], anterior: x.anterior.replace('{m}', money(prev)),
        monto: cur.monto, fecha: cur.fecha, lineMonto: ok ? t.accent : t.inputLine,
        setMonto: (e) => set({ monto: e.target.value }),
        setFecha: (e) => set({ fecha: e.target.value }),
        usar: () => set({ monto: '$ ' + fmt(prev), fecha: cur.fecha || vto }),
        ok
      };
    });
    const n = items.length;
    const cnt = items.filter(it => it.ok).length;
    const periodo = new Intl.DateTimeFormat(loc, { month: 'long', year: 'numeric' }).format(new Date(2026, 10, 1));
    return {
      items,
      tituloTxt: x.titulo.replace('{p}', periodo),
      progresoTxt: x.progreso.replace('{c}', cnt).replace('{n}', n),
      barStyle: 'height: 100%; width: ' + Math.round(cnt / n * 100) + '%; background: ' + t.highlight + '; border-radius: 4px',
      guardarTxt: cnt === 0 ? x.guardar0 : (cnt === 1 ? x.guardar1 : x.guardar.replace('{c}', cnt))
    };
  }
}
</script>
