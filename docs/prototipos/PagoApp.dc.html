<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar pago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F3A5F}a:hover{color:#15294A}
.tema-oscuro a{color:#8DB4E6}.tema-oscuro a:hover{color:#B5CEF0}
.tema-oscuro input::placeholder{color:#8E99A5}
</style>
</helmet>
<div class="{{rootClass}}" lang="{{langTag}}" style="width: 390px; height: 844px; overflow: hidden; background: {{t.bg}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: {{t.text}}; font-size: 15px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; color-scheme: {{t.scheme}}">
  <header style="display: flex; align-items: center; gap: 6px; height: 64px; padding: 0 8px; background: {{t.surface}}; border-bottom: 1px solid {{t.line}}; flex: none">
    <a href="HomeApp.dc.html" aria-label="{{x.volver}}" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="flex: 1; min-width: 0; margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 19px; font-weight: {{t.titleWeight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.titulo}}</h1>
    <button type="button" onClick="{{cambiarIdioma}}" aria-label="{{idiomaLabel}}" title="{{idiomaLabel}}" style="height: 44px; padding: 0 8px; flex: none; border: 0; border-radius: 22px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
      <span>{{idiomaCodigo}}</span>
    </button>
    <button type="button" onClick="{{toggleTema}}" aria-label="{{temaLabel}}" title="{{temaLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: transparent; color: {{t.text}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{temaIcon}}"></path></svg>
    </button>
  </header>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
    <form style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px">
      <section aria-label="{{x.obligacion}}" style="padding: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 12px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="font-size: 12px; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.04em">{{x.obligacion}}</span>
          <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{t.accent}}; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{x.cambiar}}</button>
        </div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
          <div>
            <div style="font-weight: 600; font-size: 16px">{{x.municipalidad}} · 10/2026</div>
            <div style="font-size: 13px; color: {{t.muted}}">Depto Centro 3B · {{x.aCargoProp}}</div>
          </div>
          <span style="padding: 2px 10px; border-radius: 10px; background: {{t.dangerBg}}; color: {{t.dangerText}}; font-size: 12px; font-weight: 500; white-space: nowrap">{{x.vencida}}</span>
        </div>
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: {{t.titleWeight}}">{{monto}}</div>
      </section>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="fecha" style="font-size: 13px; font-weight: 500">{{x.fecha}}</label>
          <input id="fecha" type="date" value="2026-10-13" style="height: 48px; padding: 0 12px; border: 1px solid {{t.inputLine}}; border-radius: 10px; background: {{t.surface}}; font: inherit; color: {{t.text}}; min-width: 0">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="importe" style="font-size: 13px; font-weight: 500">{{x.importe}}</label>
          <input id="importe" type="text" inputmode="decimal" value="{{importeVal}}" style="height: 48px; padding: 0 12px; border: 1px solid {{t.inputLine}}; border-radius: 10px; background: {{t.surface}}; font: inherit; color: {{t.text}}; text-align: right; min-width: 0">
        </div>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; font-weight: 500; margin-bottom: 6px">{{x.quienPago}}</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; background: {{t.segBg}}; border-radius: 12px">
          <sc-for list="{{pagadores}}" as="p" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="medio" style="font-size: 13px; font-weight: 500">{{x.medio}} <span style="font-weight: 400; color: {{t.muted}}">{{x.opcional}}</span></label>
        <select id="medio" style="height: 48px; padding: 0 12px; border: 1px solid {{t.inputLine}}; border-radius: 10px; background: {{t.surface}}; font: inherit; color: {{t.text}}">
          <sc-for list="{{medios}}" as="m" hint-placeholder-count="6">
            <option>{{m}}</option>
          </sc-for>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="operacion" style="font-size: 13px; font-weight: 500">{{x.operacion}} <span style="font-weight: 400; color: {{t.muted}}">{{x.opcional}}</span></label>
        <input id="operacion" type="text" placeholder="{{x.operacionPh}}" style="height: 48px; padding: 0 12px; border: 1px solid {{t.inputLine}}; border-radius: 10px; background: {{t.surface}}; font: inherit; color: {{t.text}}">
      </div>

      <button type="button" style="min-height: 56px; border: 1px dashed {{t.dashed}}; border-radius: 12px; background: {{t.surface}}; color: {{t.body2}}; font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        {{x.adjuntar}}
      </button>

      <button type="button" onClick="{{guardar}}" style="margin-top: auto; min-height: 52px; border: 0; border-radius: 12px; background: {{t.accent}}; color: {{t.onAccent}}; font: inherit; font-weight: 600; cursor: pointer">{{x.guardar}}</button>
    </form>
  </sc-if>

  <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; padding: 48px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 36px; background: {{t.okBg}}; color: {{t.okText}}; display: flex; align-items: center; justify-content: center">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </div>
      <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: {{t.titleWeight}}">{{x.registrado}}</h2>
      <p style="margin: 0; color: {{t.body2}}">{{confirmacion}}</p>
      <p style="margin: 0; font-size: 14px; color: {{t.muted}}">{{x.pago}} {{pagadorLabel}}</p>
      <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
        <a href="HomeApp.dc.html" style="min-height: 52px; border-radius: 12px; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{x.volverInicio}}</a>
        <button type="button" onClick="{{otro}}" style="min-height: 52px; border-radius: 12px; border: 1px solid {{t.inputLine}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-weight: 500; cursor: pointer">{{x.otro}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro"},"accent":{"editor":"color","default":"#1F3A5F","options":["#1F3A5F","#1E5E4E","#5B3A7A","#8A4B00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pagador: 'admin', saved: false, oscuro: props.tema === 'oscuro', lang: props.idioma || 'es' }; }
  componentDidUpdate(prev) {
    if (prev.tema !== this.props.tema) this.setState({ oscuro: this.props.tema === 'oscuro' });
    if (prev.idioma !== this.props.idioma) this.setState({ lang: this.props.idioma || 'es' });
  }
  tokens(oscuro, accent) {
    const accentOscuro = { '#1F3A5F': '#8DB4E6', '#1E5E4E': '#4FB596', '#1F4E79': '#6FA8DC', '#5B3A7A': '#B596D6', '#8A4B00': '#E8B460' };
    if (!oscuro) return {
      scheme: 'light', bg: '#F3F5F8', surface: '#FFFFFF', line: '#D8DEE6', inputLine: '#C5CDD8', dashed: '#A7AEA4',
      text: '#18212B', muted: '#55606B', body2: '#3D4752', titleWeight: 600, accent, onAccent: '#FFFFFF', highlight: '#E8A33D',
      segBg: '#E6E8E3', segActive: '#FFFFFF', segText: '#3D4752',
      dangerBg: '#F9E3E0', dangerText: '#8A1F14', okBg: '#E3EEEA', okText: '#14453A'
    };
    return {
      scheme: 'dark', bg: '#12171D', surface: '#1A2129', line: '#2E3843', inputLine: '#3A4552', dashed: '#4A5562',
      text: '#E8ECEF', muted: '#9AA6B2', body2: '#C3CBD3', titleWeight: 500, accent: accentOscuro[accent] || accent, onAccent: '#0E1A2B', highlight: '#F0B85A',
      segBg: '#222B35', segActive: '#2E3843', segText: '#C3CBD3',
      dangerBg: '#3A1F1C', dangerText: '#F2948A', okBg: '#17332A', okText: '#7DD3B2'
    };
  }
  textos(lang) {
    const D = {
      es: {
        titulo: 'Registrar pago', volver: 'Volver', obligacion: 'Obligación', cambiar: 'Cambiar', municipalidad: 'Municipalidad',
        aCargoProp: 'A cargo del propietario', vencida: 'Vencida', fecha: 'Fecha', importe: 'Importe (ARS)', quienPago: '¿Quién pagó?',
        admin: 'Administración', propietario: 'Propietario', inquilino: 'Inquilino', medio: 'Medio de pago', opcional: '(opcional)',
        medios: ['Transferencia', 'Pago Mis Cuentas', 'Efectivo', 'Débito automático', 'Tarjeta', 'Otro'],
        operacion: 'N.º de operación', operacionPh: 'Ej.: código de la transferencia', adjuntar: 'Adjuntar comprobante (foto o PDF)',
        guardar: 'Guardar pago', registrado: 'Pago registrado', confirmacion: 'Municipalidad 10/2026 · Depto Centro 3B quedó como pagada por {m}.',
        pago: 'Pagó:', volverInicio: 'Volver al inicio', otro: 'Registrar otro pago',
        aClaro: 'Cambiar a modo claro', aOscuro: 'Cambiar a modo oscuro', idioma: 'Idioma: Español. Cambiar idioma'
      },
      en: {
        titulo: 'Record payment', volver: 'Back', obligacion: 'Bill', cambiar: 'Change', municipalidad: 'Municipal tax',
        aCargoProp: 'Payable by owner', vencida: 'Overdue', fecha: 'Date', importe: 'Amount (ARS)', quienPago: 'Who paid?',
        admin: 'Management', propietario: 'Owner', inquilino: 'Tenant', medio: 'Payment method', opcional: '(optional)',
        medios: ['Bank transfer', 'Pago Mis Cuentas', 'Cash', 'Direct debit', 'Card', 'Other'],
        operacion: 'Transaction no.', operacionPh: 'E.g.: transfer code', adjuntar: 'Attach receipt (photo or PDF)',
        guardar: 'Save payment', registrado: 'Payment recorded', confirmacion: 'Municipal tax 10/2026 · Depto Centro 3B is now paid: {m}.',
        pago: 'Paid by:', volverInicio: 'Back to home', otro: 'Record another payment',
        aClaro: 'Switch to light mode', aOscuro: 'Switch to dark mode', idioma: 'Language: English. Change language'
      },
      pt: {
        titulo: 'Registrar pagamento', volver: 'Voltar', obligacion: 'Obrigação', cambiar: 'Alterar', municipalidad: 'Taxa municipal',
        aCargoProp: 'A cargo do proprietário', vencida: 'Vencida', fecha: 'Data', importe: 'Valor (ARS)', quienPago: 'Quem pagou?',
        admin: 'Administração', propietario: 'Proprietário', inquilino: 'Inquilino', medio: 'Forma de pagamento', opcional: '(opcional)',
        medios: ['Transferência', 'Pago Mis Cuentas', 'Dinheiro', 'Débito automático', 'Cartão', 'Outro'],
        operacion: 'N.º da operação', operacionPh: 'Ex.: código da transferência', adjuntar: 'Anexar comprovante (foto ou PDF)',
        guardar: 'Salvar pagamento', registrado: 'Pagamento registrado', confirmacion: 'Taxa municipal 10/2026 · Depto Centro 3B foi paga: {m}.',
        pago: 'Pago por:', volverInicio: 'Voltar ao início', otro: 'Registrar outro pagamento',
        aClaro: 'Mudar para modo claro', aOscuro: 'Mudar para modo escuro', idioma: 'Idioma: Português. Mudar idioma'
      }
    };
    return D[lang] || D.es;
  }
  renderVals() {
    const oscuro = this.state.oscuro;
    const lang = this.state.lang;
    const loc = { es: 'es-AR', en: 'en-US', pt: 'pt-BR' }[lang] || 'es-AR';
    const x = this.textos(lang);
    const t = this.tokens(oscuro, this.props.accent ?? '#1F3A5F');
    const monto = new Intl.NumberFormat(loc, { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(41300);
    const importeVal = new Intl.NumberFormat(loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(41300);
    const opciones = [['admin', x.admin], ['propietario', x.propietario], ['inquilino', x.inquilino]];
    const base = 'min-height: 44px; border: 0; border-radius: 9px; font: inherit; font-size: 13px; cursor: pointer;';
    const pagadores = opciones.map(([id, label]) => ({
      label,
      pressed: this.state.pagador === id ? 'true' : 'false',
      pick: () => this.setState({ pagador: id }),
      style: base + (this.state.pagador === id ? ' background: ' + t.segActive + '; color: ' + t.text + '; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.2);' : ' background: transparent; color: ' + t.segText + ';')
    }));
    const pagadorLabel = opciones.find(([id]) => id === this.state.pagador)[1];
    const orden = ['es', 'en', 'pt'];
    return {
      t, x, pagadores, pagadorLabel, monto, importeVal, medios: x.medios,
      confirmacion: x.confirmacion.replace('{m}', monto),
      editing: !this.state.saved, saved: this.state.saved,
      guardar: () => this.setState({ saved: true }),
      otro: () => this.setState({ saved: false, pagador: 'admin' }),
      langTag: loc,
      idiomaCodigo: lang.toUpperCase(),
      idiomaLabel: x.idioma,
      cambiarIdioma: () => this.setState({ lang: orden[(orden.indexOf(lang) + 1) % orden.length] }),
      rootClass: oscuro ? 'tema-oscuro' : 'tema-claro',
      temaLabel: oscuro ? x.aClaro : x.aOscuro,
      temaIcon: oscuro ? 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
      toggleTema: () => this.setState({ oscuro: !this.state.oscuro })
    };
  }
}
</script>
</body>
</html>
