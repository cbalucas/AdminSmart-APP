<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingreso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F3A5F}a:hover{color:#15294A}
.tema-oscuro a{color:#8DB4E6}.tema-oscuro a:hover{color:#B5CEF0}
</style>
</helmet>
<div class="{{rootClass}}" lang="{{langTag}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 72px 24px 24px; background: {{t.bg}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: {{t.text}}; font-size: 15px; display: flex; flex-direction: column; gap: 26px; color-scheme: {{t.scheme}}">
  <button type="button" onClick="{{cambiarIdioma}}" aria-label="{{idiomaLabel}}" title="{{idiomaLabel}}" style="position: absolute; top: 12px; left: 12px; height: 44px; padding: 0 12px; border: 1px solid {{t.line}}; border-radius: 22px; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
    <span>{{idiomaCodigo}}</span>
  </button>
  <button type="button" onClick="{{toggleTema}}" aria-label="{{temaLabel}}" title="{{temaLabel}}" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 1px solid {{t.line}}; border-radius: 22px; background: {{t.surface}}; color: {{t.text}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{temaIcon}}"></path></svg>
  </button>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64" style="flex: none; display: block"><rect width="64" height="64" rx="15" fill="#1F3A5F"></rect><rect x="12" y="12" width="18" height="18" rx="4" fill="#FFFFFF"></rect><path d="M34 30 V16 a4 4 0 0 1 4 -4 a18 18 0 0 1 14 14 a4 4 0 0 1 -4 4 Z" fill="#E8A33D"></path><rect x="12" y="34" width="18" height="18" rx="4" fill="#FFFFFF"></rect><rect x="34" y="34" width="18" height="18" rx="4" fill="#FFFFFF"></rect></svg>
    <div>
      <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: {{t.titleWeight}}">{{x.titulo}}</h1>
      <p style="margin: 6px 0 0; color: {{t.muted}}; font-size: 14px">{{x.sub}}</p>
    </div>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 13px; font-weight: 500">{{x.email}}</label>
      <input id="email" type="email" value="{{x.emailVal}}" style="height: 48px; padding: 0 14px; border: 1px solid {{t.inputLine}}; border-radius: 10px; background: {{t.surface}}; font: inherit; color: {{t.text}}">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="clave" style="font-size: 13px; font-weight: 500">{{x.clave}}</label>
      <div style="display: flex; align-items: center; height: 48px; border: 1px solid {{t.inputLine}}; border-radius: 10px; background: {{t.surface}}">
        <input id="clave" type="password" value="clave1234" style="flex: 1; min-width: 0; height: 100%; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font: inherit; color: {{t.text}}">
        <button type="button" aria-label="{{x.mostrar}}" style="width: 48px; height: 46px; border: 0; background: transparent; color: {{t.muted}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 8px">
      <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{t.accent}}">
        {{x.recordar}}
      </label>
      <a href="#" style="font-size: 14px">{{x.olvide}}</a>
    </div>
    <a href="HomeApp.dc.html" style="height: 50px; border-radius: 10px; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{x.ingresar}}</a>
  </form>

  <div style="display: flex; align-items: center; gap: 12px; color: {{t.muted}}; font-size: 13px">
    <span style="flex: 1; height: 1px; background: {{t.line}}"></span>{{x.o}}<span style="flex: 1; height: 1px; background: {{t.line}}"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 48px; border-radius: 10px; border: 1px solid {{t.inputLine}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12.2a8 8 0 1 1-2.4-5.7"></path><path d="M20 12h-8"></path></svg>
      {{x.google}}
    </button>
    <button type="button" style="height: 48px; border-radius: 10px; border: 1px solid {{t.inputLine}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11v3a8 8 0 0 1-1.5 4.6"></path><path d="M8.5 8.5A4.5 4.5 0 0 1 16.5 11v2a12 12 0 0 1-.6 3.8"></path><path d="M5 15.5a12 12 0 0 0 .5-3.5V11a6.5 6.5 0 0 1 11.8-3.8"></path><path d="M20 11v1a16 16 0 0 1-.7 4.6"></path></svg>
      {{x.biometria}}
    </button>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; text-align: center">
    <p style="margin: 0; color: {{t.body2}}">{{x.invitacion}} <a href="#">{{x.activar}}</a></p>
    <p style="margin: 0; color: {{t.body2}}">{{x.sinCuenta}} <a href="#">{{x.registro}}</a></p>
    <p style="margin: 8px 0 0; color: {{t.muted}}; font-size: 12px">{{x.version}}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"tema":{"editor":"enum","options":["claro","oscuro"],"default":"claro"},"accent":{"editor":"color","default":"#1F3A5F","options":["#1F3A5F","#1E5E4E","#5B3A7A","#8A4B00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { oscuro: props.tema === 'oscuro', lang: props.idioma || 'es' }; }
  componentDidUpdate(prev) {
    if (prev.tema !== this.props.tema) this.setState({ oscuro: this.props.tema === 'oscuro' });
    if (prev.idioma !== this.props.idioma) this.setState({ lang: this.props.idioma || 'es' });
  }
  tokens(oscuro, accent) {
    const accentOscuro = { '#1F3A5F': '#8DB4E6', '#1E5E4E': '#4FB596', '#1F4E79': '#6FA8DC', '#5B3A7A': '#B596D6', '#8A4B00': '#E8B460' };
    if (!oscuro) return {
      scheme: 'light', bg: '#F3F5F8', surface: '#FFFFFF', line: '#D8DEE6', inputLine: '#C5CDD8',
      text: '#18212B', muted: '#55606B', body2: '#3D4752', titleWeight: 600, accent, onAccent: '#FFFFFF'
    };
    return {
      scheme: 'dark', bg: '#12171D', surface: '#1A2129', line: '#2E3843', inputLine: '#3A4552',
      text: '#E8ECEF', muted: '#9AA6B2', body2: '#C3CBD3', titleWeight: 500, accent: accentOscuro[accent] || accent, onAccent: '#0E1A2B'
    };
  }
  textos(lang) {
    const D = {
      es: {
        titulo: 'Administración Inteligente', sub: 'Ingrese con su cuenta', email: 'Email', emailVal: '[usuario@correo.com]', clave: 'Contraseña',
        mostrar: 'Mostrar contraseña', recordar: 'Recordar mi email', olvide: 'Olvidé mi contraseña', ingresar: 'Ingresar', o: 'o',
        google: 'Continuar con Google', biometria: 'Ingresar con huella o rostro', invitacion: '¿Recibió una invitación?', activar: 'Activar mi cuenta',
        sinCuenta: '¿No tiene cuenta?', registro: 'Solicitar registro', version: 'Versión 1.0.0',
        aClaro: 'Cambiar a modo claro', aOscuro: 'Cambiar a modo oscuro', idioma: 'Idioma: Español. Cambiar idioma'
      },
      en: {
        titulo: 'Administración Inteligente', sub: 'Sign in to your account', email: 'Email', emailVal: '[user@email.com]', clave: 'Password',
        mostrar: 'Show password', recordar: 'Remember my email', olvide: 'Forgot my password', ingresar: 'Sign in', o: 'or',
        google: 'Continue with Google', biometria: 'Sign in with fingerprint or face', invitacion: 'Received an invitation?', activar: 'Activate my account',
        sinCuenta: "Don't have an account?", registro: 'Request access', version: 'Version 1.0.0',
        aClaro: 'Switch to light mode', aOscuro: 'Switch to dark mode', idioma: 'Language: English. Change language'
      },
      pt: {
        titulo: 'Administración Inteligente', sub: 'Entre com sua conta', email: 'E-mail', emailVal: '[usuario@email.com]', clave: 'Senha',
        mostrar: 'Mostrar senha', recordar: 'Lembrar meu e-mail', olvide: 'Esqueci minha senha', ingresar: 'Entrar', o: 'ou',
        google: 'Continuar com o Google', biometria: 'Entrar com digital ou rosto', invitacion: 'Recebeu um convite?', activar: 'Ativar minha conta',
        sinCuenta: 'Não tem conta?', registro: 'Solicitar cadastro', version: 'Versão 1.0.0',
        aClaro: 'Mudar para modo claro', aOscuro: 'Mudar para modo escuro', idioma: 'Idioma: Português. Mudar idioma'
      }
    };
    return D[lang] || D.es;
  }
  renderVals() {
    const oscuro = this.state.oscuro;
    const lang = this.state.lang;
    const x = this.textos(lang);
    const orden = ['es', 'en', 'pt'];
    return {
      x, t: this.tokens(oscuro, this.props.accent ?? '#1F3A5F'),
      langTag: { es: 'es-AR', en: 'en-US', pt: 'pt-BR' }[lang] || 'es-AR',
      idiomaCodigo: lang.toUpperCase(),
      idiomaLabel: x.idioma,
      cambiarIdioma: () => this.setState({ lang: orden[(orden.indexOf(lang) + 1) % orden.length] }),
      rootClass: oscuro ? 'tema-oscuro' : 'tema-claro',
      temaLabel: oscuro ? x.aClaro : x.aOscuro,
      temaIcon: oscuro ? 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
      toggleTema: () => this.setState({ oscuro: !this.state.oscuro })
    };
  }
}
</script>
</body>
</html>
